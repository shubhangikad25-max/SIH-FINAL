# Spring Boot Configuration - AICTE APAAR Platform (SIH26263)
server.port=8085

# Application Details
spring.application.name=apaar-verify-backend

# Security & Safe Error Handling (No stack traces exposed in production)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:AICTE_APAAR_VERIFY_PRODUCTION_KEY_2026_NEP2020_SECURE_HMAC512_SUPER_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google OAuth 2.0 Credentials (Injected from Render environment variables in production)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# APAAR External Gateway Integration
apaar.external-api.configured=${APAAR_EXTERNAL_API_CONFIGURED:false}

# Database & JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Embedded H2 Console (Accessible only when running locally without PostgreSQL)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Kafka Broker Configuration (Simulated local publisher topic)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=500
spring.kafka.producer.retries=0

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
